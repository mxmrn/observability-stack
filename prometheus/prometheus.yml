global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Native histograms travel only in the protobuf exposition format: neither
  # OpenMetrics text 1.0 nor the old text format can carry them. The default
  # list here holds only the two text formats, so a service exposing native
  # buckets would have them silently dropped at scrape time and the only symptom
  # would be a quantile that is still coarse.
  #
  # Protobuf is listed first and the text formats stay as fallbacks: the Accept
  # header offers all three and each target picks what it can serve, so
  # cadvisor, node-exporter and anything else that never heard of protobuf keep
  # working unchanged. Exemplars survive too - protobuf carried them before
  # OpenMetrics existed.
  #
  # When a metric exposes both classic and native buckets, Prometheus keeps the
  # native one and drops the classic series. That is deliberate here: the
  # classic buckets stay in the code so that `curl /metrics` is still readable
  # by a human, while the stored series is the one worth querying.
  # always_scrape_classic_histograms: true would keep both, at the cost of
  # paying the classic cardinality bill we are trying to get rid of.
  scrape_protocols:
    - PrometheusProto
    - OpenMetricsText1.0.0
    - PrometheusText0.0.4
  # The second gate, and just as quiet as the first. Negotiating protobuf is not
  # enough: native buckets that arrive are still discarded unless this is on. It
  # used to be switched on by --enable-feature=native-histograms, which no longer
  # exists in Prometheus 3.14, so it has to be said here. With protobuf
  # negotiated and this left at its default false, /metrics serves native
  # buckets, Prometheus reads them, and stores nothing - and the only symptom is
  # that the quantiles stay as coarse as they were.
  scrape_native_histograms: true

rule_files:
  - /etc/prometheus/rules/*.yml

# OTLP metrics ingestion (from the OTel Collector).
otlp:
  # Resource attributes promoted to regular labels on every series.
  # The rest are available via a join with target_info.
  promote_resource_attributes: [project, service, deployment.environment]

storage:
  tsdb:
    # Push sources (OTLP, remote_write) may deliver samples slightly out of order.
    out_of_order_time_window: 30m

scrape_configs:
  # ---------------------------------------------------------------------------
  # Auto-discovery: any container on the `observability` network with labels
  #   observability.scrape: "true"
  #   observability.port:   "8080"
  #   observability.path:   "/metrics"   (optional)
  #   observability.interval: "5s"       (optional)
  # ---------------------------------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: tcp://docker-proxy:2375
        refresh_interval: 10s
        filters:
          - name: label
            values: ["observability.scrape=true"]
    relabel_configs:
      # No port, nothing to scrape.
      - source_labels: [__meta_docker_container_label_observability_port]
        regex: ""
        action: drop
      # Address the container by name, not by the IP of one of its networks.
      # docker_sd emits a target per network, and which networks it reports
      # depends on the container's network mode, so filtering by network name
      # silently loses containers whose primary network is their own. By name,
      # every copy of the target is identical and Prometheus collapses them,
      # while docker's embedded DNS resolves the name on the shared network.
      - source_labels: [__meta_docker_container_name, __meta_docker_container_label_observability_port]
        regex: /?(.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_docker_container_label_observability_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_label_observability_interval]
        regex: (.+)
        target_label: __scrape_interval__
      # The timeout may not exceed the interval (default timeout is 10s), or the target is rejected.
      - source_labels: [__meta_docker_container_label_observability_interval]
        regex: (.+)
        target_label: __scrape_timeout__

      # project/service: taken from the labels docker compose sets automatically;
      # explicit observability.project / observability.service override them.
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [__meta_docker_container_label_observability_project]
        regex: (.+)
        target_label: project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_observability_service]
        regex: (.+)
        target_label: service

      # job = project/service (same as OTLP metrics: service.namespace/service.name),
      # instance = container name, so replicas are distinguishable and readable.
      - source_labels: [project, service]
        separator: /
        target_label: job
      - source_labels: [__meta_docker_container_name]
        regex: /?(.+)
        target_label: instance

  # Resources of all containers. These metrics describe *other* containers,
  # so project/service come from the metric's own labels, not the target's.
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: [cadvisor:8080]
        labels: { project: observability, service: cadvisor }
    metric_relabel_configs:
      # id="/" is the root cgroup: the whole machine, which cAdvisor exports next
      # to the containers. It carries no compose labels, so nothing overrode the
      # target's own project=observability below, and every
      # sum(container_*{project="observability"}) silently became a host-wide
      # total. The host has its own source (node-exporter); this copy only lies.
      - source_labels: [__name__, name, id]
        regex: container_.+;;.+
        action: drop
      # Same trap for containers started outside compose (kind nodes, a manual
      # docker run): with no labels of their own they inherit cAdvisor's. Reset
      # them first, so an unlabelled container shows up as unlabelled instead of
      # being counted as part of the observability stack.
      - source_labels: [__name__, id]
        regex: container_.+;.+
        target_label: project
        replacement: unlabeled
      - source_labels: [__name__, id]
        regex: container_.+;.+
        target_label: service
        replacement: unlabeled
      - source_labels: [container_label_com_docker_compose_project]
        regex: (.+)
        target_label: project
      - source_labels: [container_label_com_docker_compose_service]
        regex: (.+)
        target_label: service
      - regex: container_label_com_docker_compose_(project|service)
        action: labeldrop

  # Host CPU, memory, disk: the main signal for "we hit the laptop's limit, not the service's".
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: { project: observability, service: node-exporter }
