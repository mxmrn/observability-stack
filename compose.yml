# Shared observability stack for projects.
# Projects join the external `observability` network (see templates/).
name: observability

x-common: &common
  restart: unless-stopped
  networks: [observability]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # Read-only Docker API access for service discovery (Prometheus) and log collection (Alloy).
  # Nobody but the proxy gets docker.sock itself (socket access == root on the host).
  docker-proxy:
    <<: *common
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 64M }

  otel-collector:
    <<: *common
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC (for services running on the host)
      - "127.0.0.1:4318:4318" # OTLP HTTP
    labels:
      observability.scrape: "true"
      observability.port: "8888"
    depends_on: [prometheus, tempo, loki]
    deploy:
      resources:
        limits: { cpus: "${OTELCOL_CPUS:-1}", memory: "${OTELCOL_MEMORY:-1G}" }

  prometheus:
    <<: *common
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-3d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-5GB}
      - --web.enable-remote-write-receiver # Tempo metrics-generator, k6, in-cluster agent from kind
      - --web.enable-otlp-receiver # metrics from the OTel Collector
      - --web.enable-lifecycle # POST /-/reload re-reads the config
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    labels:
      observability.scrape: "true"
      observability.port: "9090"
    deploy:
      resources:
        limits: { cpus: "${PROM_CPUS:-1}", memory: "${PROM_MEMORY:-1536M}" }

  tempo:
    <<: *common
    image: grafana/tempo:3.0.3
    command:
      [
        "-target=all",
        "-config.file=/etc/tempo/tempo.yaml",
        "-config.expand-env=true",
      ]
    user: "0" # local backend writes to the volume; image user 10001 lacks permissions on it
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    labels:
      observability.scrape: "true"
      observability.port: "3200"
    deploy:
      resources:
        limits: { cpus: "${TEMPO_CPUS:-1}", memory: "${TEMPO_MEMORY:-1G}" }

  loki:
    <<: *common
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "0"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    labels:
      observability.scrape: "true"
      observability.port: "3100"
    deploy:
      resources:
        limits: { cpus: "${LOKI_CPUS:-1}", memory: "${LOKI_MEMORY:-1G}" }

  # Collects stdout/stderr of every container on the observability network and ships it to Loki.
  alloy:
    <<: *common
    image: grafana/alloy:v1.19.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    labels:
      observability.scrape: "true"
      observability.port: "12345"
    depends_on: [loki, docker-proxy]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  grafana:
    <<: *common
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      observability.scrape: "true"
      observability.port: "3000"
    depends_on: [prometheus, tempo, loki]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  # Per-container CPU, throttling, memory, network: what matters most during load tests.
  cadvisor:
    <<: *common
    image: ghcr.io/google/cadvisor:v0.60.5
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,resctrl,advtcp,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 64M }

  # Stack check: docker compose --profile smoke run --rm smoke
  # Sends traces as service smoke-api of project smoke -> visible in Tempo, Prometheus (spanmetrics), Grafana.
  smoke:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
    profiles: [smoke]
    networks: [observability]
    command:
      - traces
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --service=smoke-api
      - --otlp-attributes=service.namespace="smoke"
      - --child-spans=3
      - --rate=50
      - --duration=60s
      - --workers=2

networks:
  # The stack creates the network under a fixed name (no project prefix).
  # Projects declare it as `external: true` and just join it.
  observability:
    name: observability

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  alloy-data:
  grafana-data:
