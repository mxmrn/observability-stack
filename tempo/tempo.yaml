# Tempo 3 in monolithic mode (-target=all): one process, storage on local disk.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# Traces arrive only from the OTel Collector.
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }

# metrics-generator derives metrics from the span stream and remote-writes them to Prometheus:
#  - span-metrics:   traces_spanmetrics_calls_total / _latency_bucket: RED for every service, no code needed
#  - service-graphs: traces_service_graph_*: who calls whom (Service Graph in Grafana)
metrics_generator:
  registry:
    external_labels: { source: tempo }
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true # exemplars: jump from a point on a latency graph to a concrete trace
  processor:
    span_metrics:
      dimensions: [project] # resource attribute set by the collector -> `project` label
    service_graphs:
      dimensions: [project]

storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
    compaction:
      block_retention: ${TEMPO_RETENTION:-72h}

usage_report:
  reporting_enabled: false
